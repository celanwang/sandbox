taskId: s0-order-query
version: 2
capability: tool-contract
env:
  scene: lunch
  account: alice
  seed: 0
faults: []
script:
  prompt: |
    我的账号里已经有标签为「公司」的配送地址，请先查询地址列表并直接使用公司地址，
    不要再来问我地址。
    然后下单一份巨无霸三件套（默认搭配）送到该地址，不要付款。
    下单成功后调用 query-order 查询这笔订单的当前状态，并报告订单号。
  approvals:
    - {call: create}
  budgetFen: 6000
  quoteItems:
    - {productCode: "100101", quantity: 1}
expect:
  calls:
    - {id: addresses, tool: delivery-query-addresses, addressTag: 公司}
    - id: quote
      tool: calculate-price
      args: {beType: 2, orderType: 2}
    - id: create
      tool: create-order
      args: {beType: 2, orderType: 2}
      bind: {addressId: addresses, storeCode: quote}
      withinBudget: true
    - {id: query, tool: query-order, bind: {orderId: create}, withinBudget: true}
  state: {order: {from: create, status: 待支付}}
  reply: {fromCalls: [query], noAddressQuestion: true}
