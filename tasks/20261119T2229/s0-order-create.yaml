taskId: s0-order-create
version: 2
capability: tool-contract
env:
  scene: lunch
  account: alice
  seed: 0
faults: []
script:
  prompt: |
    我的账号里已经有标签为「公司」的配送地址，请先用 delivery-query-addresses 查询地址列表，
    直接使用公司地址，不要再来问我地址。
    然后下单一份巨无霸三件套（默认搭配）送到该地址，不要付款。
    请用「总价：…元」报告金额，并报告订单号。
  approvals:
    - {call: create}
  budgetFen: 6000
  quoteItems:
    - {productCode: "100101", quantity: 1}
expect:
  calls:
    - {id: addresses, tool: delivery-query-addresses, addressTag: 公司}
    - id: quote
      tool: calculate-price
      args: {beType: 2, orderType: 2}
    - id: create
      tool: create-order
      args: {beType: 2, orderType: 2}
      bind: {addressId: addresses, storeCode: quote}
      withinBudget: true
  state: {order: {from: create, status: 待支付}}
  reply: {fromCalls: [quote, create], noAddressQuestion: true}
